version: 2

project_name: gh-workspace

builds:
  - id: gh-workspace
    main: ./cmd/gh-workspace
    binary: gh-workspace
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: extension-binaries
    formats:
      - binary
    name_template: gh-workspace-{{ .Os }}-{{ .Arch }}

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
  make_latest: true
