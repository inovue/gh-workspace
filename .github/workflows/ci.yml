name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test-matrix:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/gh-workspace

  # Branch protection requires a single "Test" check; it passes only when
  # every platform passes.
  test:
    name: Test
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform to pass
        run: test "${{ needs.test-matrix.result }}" = success
